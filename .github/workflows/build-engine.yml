name: Build engine (pinned)

# Dedicated, low-frequency build workflow for AdventureAI's custom Godot
# binary (docs/CI_CD.md Phase 0 in garf0134/adventure). Dispatched manually
# whenever tools/ci/engine_pin.json's source_commit changes in that repo —
# not on every push, and not on this repo's own push/PR/merge_group events
# (those are handled by runner.yml, gated off here via the DISABLE_GODOT_CI
# repo variable so this fork doesn't run upstream's full ~20-job matrix).
#
# debug_symbols=yes deliberately deviates from upstream's own build
# presets (which ship it off) — this binary gets used to step into engine
# source, not just run it, so the .pdb is kept rather than stripped in
# "Prepare artifact" and published as a second release asset alongside
# the .exe.
#
# source_commit/binary_release_tag are passed as inputs rather than read
# from a committed file in this repo, because the pin's source of truth
# lives in garf0134/adventure, not here. The checkout ref pins explicitly
# to the input SHA, deliberately, so the built binary always matches it
# regardless of which ref happened to be checked out when this workflow
# was dispatched — see docs/CI_CD.md §4's checkout-by-exact-SHA gotcha in
# the AdventureAI repo for why that matters.
#
# The release step pins targetCommitish the same way, but relies on the
# release tag ALREADY EXISTING before this workflow is dispatched — it
# does not create the tag itself. Two GITHUB_TOKEN restrictions rule that
# out, and neither is fixable via the `permissions:` block at any setting:
#   1. `gh release create --target <sha>` (a raw commit SHA, as opposed to
#      a branch/tag name) 403s with "Resource not accessible by
#      integration" even under contents:write (cli/cli#9514): GITHUB_TOKEN
#      is a GitHub App installation token, and the Git Data API call gh
#      makes to resolve an arbitrary SHA for --target is blocked for App
#      tokens specifically, independent of scope.
#   2. Pushing the tag as a ref instead (`git tag` + `git push`) hits a
#      second, harder restriction: this repo's tree always contains
#      `.github/workflows/`, and creating ANY new ref — branch or tag —
#      that points into a tree containing workflow files needs a
#      `workflows` permission that GITHUB_TOKEN can never hold (it isn't
#      even a valid key in this `permissions:` block — GitHub rejects the
#      workflow file itself if you try).
# So the tag has to be created out-of-band, by something holding a real
# PAT with `workflow` scope, before dispatching this workflow — see
# docs/CI_CD.md §9 in the AdventureAI repo for the operator step. Once the
# tag exists, `gh release create <tag>` with no --target needs only
# contents:write, since it's creating a release from an existing ref
# rather than resolving/creating one.
#
# build-windows-template-release (added for docs/CI_CD.md Phase 4, release
# builds) publishes onto this SAME release/tag via `gh release upload`,
# `needs: build-windows-editor` so the release already exists to upload
# onto — one engine commit, one release, every artifact (editor + release
# export template) built from it. This is deliberate: AdventureAI's
# release workflow exports through this template, not a stock downloaded
# one, for the same reason it tests against the custom editor binary
# rather than a stock download — a release built with a different engine
# than the one CI verified against would mean the verification never
# actually covered the binary that ships. Unlike the editor job, this one
# carries neither dev_mode=yes (adds runtime assertions/debug checks —
# wrong for a binary meant to run at release speed) nor debug_symbols=yes
# (this binary isn't used to step into engine source, only the editor is);
# windows_subsystem is also left at its default (windowed, no console)
# rather than the editor's windows_subsystem=console, since a shipped game
# window flashing a console on launch is a real user-facing regression the
# editor binary doesn't need to avoid.

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact commit SHA to build (must match tools/ci/engine_pin.json's source_commit in garf0134/adventure)"
        required: true
      binary_release_tag:
        description: "Release tag to publish under — must already exist as a git tag pointing at source_commit (see header comment above)"
        required: true

permissions:
  contents: write

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=yes
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8

jobs:
  build-windows-editor:
    # Matches GODOT_PATH in garf0134/adventure's .mcp.json
    # (godot.windows.editor.x86_64.exe) — msvc, target=editor only.
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: windows-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            windows_subsystem=console
            vsproj=no
            d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: windows
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: windows-editor
        continue-on-error: true

      - name: Prepare artifact
        run: |
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/*.exp,bin/*.lib -Force -ErrorAction SilentlyContinue

      - name: Verify binary
        run: |
          ./bin/godot.windows.editor.x86_64.exe --version
          ./bin/godot.windows.editor.x86_64.exe --help

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent, added alongside build-windows-template-release: a
          # re-dispatch against a tag whose release already exists (e.g. to
          # add the template job's asset after the fact, or a retry) must
          # not fail here just because `gh release create` refuses to
          # recreate an existing release -- upload onto it instead.
          gh release view "${{ inputs.binary_release_tag }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ inputs.binary_release_tag }}" `
              "./bin/godot.windows.editor.x86_64.exe" `
              "./bin/godot.windows.editor.x86_64.pdb" `
              --clobber
          } else {
            gh release create "${{ inputs.binary_release_tag }}" `
              "./bin/godot.windows.editor.x86_64.exe" `
              "./bin/godot.windows.editor.x86_64.pdb" `
              --title "Engine build ${{ inputs.binary_release_tag }}" `
              --notes "Pinned custom editor build for AdventureAI CI/CD (docs/CI_CD.md Phase 0, garf0134/adventure). Source commit: ${{ inputs.source_commit }}."
          }

  build-windows-template-release:
    # Windows release export template (target=template_release) — what
    # AdventureAI's release workflow (docs/CI_CD.md Phase 4,
    # garf0134/adventure) actually invokes `--export-release` against via
    # export_presets.cfg's custom_template/release. needs:
    # build-windows-editor so the release this uploads onto already
    # exists; see the header comment above for why this isn't a separate
    # tag/release.
    needs: build-windows-editor
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: windows-template-release
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            module_text_server_fb_enabled=yes
            vsproj=no
            d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: windows
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: windows-template-release
        continue-on-error: true

      - name: Prepare artifact
        run: |
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/*.exp,bin/*.lib -Force -ErrorAction SilentlyContinue

      - name: Verify binary
        run: |
          ./bin/godot.windows.template_release.x86_64.exe --version

      - name: Publish onto existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.binary_release_tag }}" `
            "./bin/godot.windows.template_release.x86_64.exe" `
            --clobber
