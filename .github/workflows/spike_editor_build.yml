name: AdventureAI CI Spike — Editor Build

# Throwaway workflow for AdventureAI's docs/CI_CD.md Phase 0 spike. Not
# part of upstream godotengine/godot's own CI. Builds only the MSVC editor
# target (matching AdventureAI's pinned local binary,
# godot.windows.editor.x86_64.exe) on windows-latest, then exercises the
# release-tag round trip the pin file (docs/CI_CD.md §4) depends on:
# publish the binary as a release asset, then fetch it back by tag in a
# second job to prove that path actually works end to end.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Record start time
        id: start
        shell: bash
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: adventureai-windows-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::D3D12 SDK install failed, building without it."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE install failed, building without it."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download WinRT components
        shell: sh
        run: python ./misc/scripts/install_winrt.py
        continue-on-error: true

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit install failed, building without it."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            windows_subsystem=console
            vsproj=no
            d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: windows
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: adventureai-windows-editor
        continue-on-error: true

      - name: Record elapsed build time
        id: timing
        shell: bash
        run: |
          end=$(date +%s)
          elapsed=$(( end - ${{ steps.start.outputs.start }} ))
          echo "Build took ${elapsed} seconds ($((elapsed / 60))m $((elapsed % 60))s)"

      - name: Verify binary launches
        shell: pwsh
        run: |
          ./bin/godot.windows.editor.x86_64.exe --version
          ./bin/godot.windows.editor.x86_64.exe --headless --quit

      - name: Prepare artifact
        shell: pwsh
        run: |
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/*.exp,bin/*.lib,bin/*.pdb -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path bin/godot.windows.editor.x86_64.exe -DestinationPath godot.windows.editor.x86_64.zip

      - name: Create GitHub Release (pin round-trip test)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAG="engine-${SHORT_SHA}-spike"
          gh release create "$TAG" godot.windows.editor.x86_64.zip \
            --repo "${{ github.repository }}" \
            --title "AdventureAI CI spike: ${TAG}" \
            --notes "Throwaway spike for docs/CI_CD.md Phase 0 (AdventureAI repo). Source commit: $(git rev-parse HEAD)" \
            --target "$(git rev-parse HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Created release tag: ${TAG}"

  verify_fetch:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Fetch the published binary by release tag only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          echo "Fetching release: ${TAG}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json targetCommitish,assets,tagName
          mkdir -p fetch-test
          gh release download "$TAG" --repo "${{ github.repository }}" --dir fetch-test
          ls -la fetch-test
          echo "Round trip confirmed: tag -> source commit + downloadable binary asset, no other input needed."
